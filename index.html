<style>
  /* ✏️ 색상 — 여기 숫자만 바꾸면 전체 색이 바뀌어요 */
  :root{
    --bg:#ece3d7;       /* 바깥 배경 (PC에서 양옆) */
    --paper:#faf6f0;    /* 청첩장 종이색 */
    --ink:#4b3e35;      /* 기본 글자색 */
    --soft:#8c7a6b;     /* 옅은 글자색 */
    --accent:#b08a68;   /* 포인트 색 (버튼, 강조) */
    --line:#e7ddd0;     /* 구분선 */
    --sun:#c47a6c;      /* 일요일, D-day 강조 */
    --empty:#ebe0d3;    /* 사진이 없을 때 빈 칸 색 */
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Gowun Batang","Noto Serif JP",serif;line-height:1.8;word-break:keep-all}
  body.ja{font-family:"Noto Serif JP","Gowun Batang",serif}
  .wrap{max-width:480px;margin:0 auto;background:var(--paper);min-height:100vh;box-shadow:0 0 40px rgba(75,62,53,.08);overflow:hidden}

  section{padding:72px 28px;text-align:center;border-top:1px solid var(--line)}
  .eyebrow{font-family:"Cormorant Garamond",serif;font-style:italic;letter-spacing:.18em;color:var(--accent);font-size:16px;margin-bottom:6px}
  h2{font-size:20px;font-weight:700;margin-bottom:32px;letter-spacing:.02em}
  body.ja h2{font-weight:600}

  /* 언어 선택 버튼 */
  .lang{position:fixed;top:14px;right:max(14px, calc(50% - 226px));z-index:50;display:flex;background:rgba(250,246,240,.92);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .lang button{border:0;background:none;font:inherit;font-size:12px;padding:4px 11px;border-radius:999px;color:var(--soft);cursor:pointer}
  .lang button.on{background:var(--accent);color:#fff}

  /* 사진 칸 (사진이 없으면 빈 칸으로 보여요) */
  .photo{position:relative;background:var(--empty);overflow:hidden}
  .photo::before{content:attr(data-empty);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--soft);font-family:"Cormorant Garamond",serif;font-style:italic;font-size:14px;letter-spacing:.1em}
  .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

  /* 첫 화면 */
  .cover{padding:0 0 60px;border-top:0}
  .cover-top{padding:70px 28px 32px}
  .cover-names{font-size:25px;letter-spacing:.06em;margin-top:8px}
  body.ja .cover-names{font-size:20px}
  .cover-names .amp{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--accent);margin:0 10px}
  .cover .photo{aspect-ratio:3/4;margin:0 32px;border-radius:999px 999px 0 0}
  .cover-info{margin-top:30px;font-size:15px;color:var(--soft);padding:0 28px}

  /* 인사말 */
  .greeting{font-size:15px;line-height:2.2;margin-bottom:44px}
  .parents{display:grid;gap:10px;font-size:15px}
  .parents .rel{color:var(--soft);font-size:13px;margin:0 2px}
  .parents b{font-size:17px;margin-left:4px}

  /* 달력 */
  .cal-date{font-size:16px;margin-bottom:28px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;font-size:14px;padding:18px 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .cal span{height:38px;display:flex;align-items:center;justify-content:center}
  .cal .wd{height:30px;font-size:12px;color:var(--soft)}
  .cal .sun{color:var(--sun)}
  .cal .wedding b{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:400}
  .dday{margin:30px 0 22px;font-size:15px}
  .dday b{color:var(--sun)}

  /* 버튼 */
  .btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:9px 20px;font:inherit;font-size:14px;text-decoration:none;cursor:pointer}
  .btn.fill{background:var(--accent);color:#fff}

  /* 갤러리 */
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .gallery .photo{aspect-ratio:1;cursor:pointer}
  .gallery .photo::before{font-size:12px}

  /* 사진 크게 보기 */
  .lb{position:fixed;inset:0;background:rgba(30,24,20,.95);display:none;align-items:center;justify-content:center;z-index:100}
  .lb.open{display:flex}
  .lb img{max-width:100%;max-height:84vh;object-fit:contain}
  .lb button{position:absolute;background:none;border:0;color:#fff;font-size:30px;line-height:1;padding:16px;cursor:pointer;opacity:.85}
  .lb .close{top:6px;right:6px}
  .lb .prev{left:0;top:50%;transform:translateY(-50%)}
  .lb .next{right:0;top:50%;transform:translateY(-50%)}
  .lb .count{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#fff;font-size:13px;opacity:.7}

  /* 오시는 길 */
  .venue{font-size:17px;font-weight:700}
  body.ja .venue{font-weight:600}
  .addr{color:var(--soft);font-size:14px;margin:6px 0 16px}
  .map{width:100%;height:260px;border:0;border-radius:14px;margin:26px 0 10px;background:var(--empty);display:block}
  .map-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .map-btns a{display:block;padding:10px 4px;font-size:13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);text-decoration:none}
  .transit{text-align:left;margin-top:40px;display:grid;gap:22px}
  .transit h3{font-size:15px;color:var(--accent);margin-bottom:4px}
  .transit p{font-size:14px}
  .ja-only{display:none}
  body.ja .ja-only{display:block}

  /* 계좌번호 */
  .acc-desc{font-size:14px;color:var(--soft);margin:-12px 0 28px}
  details{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;text-align:left;overflow:hidden}
  summary{list-style:none;padding:16px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:15px}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1}
  details[open] summary::after{content:"−"}
  .acc{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-top:1px solid var(--line)}
  .acc small{display:block;color:var(--soft);font-size:12px}
  .acc .num{font-size:14px}
  .acc .btn{padding:5px 14px;font-size:12px;flex-shrink:0}

  footer{padding:60px 28px 70px;text-align:center;border-top:1px solid var(--line)}
  footer .thanks{font-size:14px;color:var(--soft);margin:18px 0 28px}
  footer .sign{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--accent);font-size:15px;letter-spacing:.1em;margin-top:36px}

  /* 복사 알림 */
  .toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,16px);background:rgba(75,62,53,.92);color:#fff;padding:10px 22px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:200}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* 스크롤하면 부드럽게 나타나는 효과 */
  .fade{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s ease}
  .fade.show{opacity:1;transform:none}
</style>
</head>

    roleGroom: '新郎', roleGroomFather: '新郎の父', roleGroomMother: '新郎の母',
    roleBride: '新婦', roleBrideFather: '新婦の父', roleBrideMother: '新婦の母',
    copy: 'コピー',
    copied: 'コピーしました',

    thanks: '心より感謝申し上げます',
    copyLink: '招待状のリンクをコピー',
  },
};

// ============================================================
// 여기부터 아래는 동작을 담당하는 부분이라 수정하지 않아도 돼요
// ============================================================
const $ = id => document.getElementById(id);
let lang = 'ko';

function buildCalendar() {
  const t = TEXT[lang];
  const y = WEDDING.date.getFullYear(), m = WEDDING.date.getMonth(), d = WEDDING.date.getDate();
  const first = new Date(y, m, 1).getDay();
  const last = new Date(y, m + 1, 0).getDate();
  let html = t.weekdays.map((w, i) => `<span class="wd${i === 0 ? ' sun' : ''}">${w}</span>`).join('');
  for (let i = 0; i < first; i++) html += '<span></span>';
  for (let day = 1; day <= last; day++) {
    const sun = (first + day - 1) % 7 === 0 ? 'sun' : '';
    html += day === d
      ? `<span class="wedding"><b>${day}</b></span>`
      : `<span class="${sun}">${day}</span>`;
  }
  $('cal').innerHTML = html;
}

function buildDday() {
  const t = TEXT[lang];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const wd = new Date(WEDDING.date); wd.setHours(0, 0, 0, 0);
  const diff = Math.round((wd - today) / 86400000);
  $('dday').innerHTML = diff > 0 ? t.ddayBefore.replace('{n}', diff)
    : diff === 0 ? t.ddayToday
    : t.ddayAfter.replace('{n}', -diff + 1);
}

function calendarLink() {
  const fmt = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const end = new Date(WEDDING.date.getTime() + 90 * 60000);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(TEXT[lang].calEventTitle)
    + '&dates=' + fmt(WEDDING.date) + '/' + fmt(end)
    + '&location=' + encodeURIComponent(WEDDING.mapQuery)
    + '&details=' + encodeURIComponent(WEDDING.siteUrl);
}

function buildAccounts() {
  const t = TEXT[lang];
  const row = a => `
    <div class="acc">
      <div><small>${t[a.role]} · ${a.name}</small><span class="num">${a.bank} ${a.number}</span></div>
      <button class="btn" data-copy="${a.bank} ${a.number}">${t.copy}</button>
    </div>`;
  $('accGroom').innerHTML = ACCOUNTS.groom.map(row).join('');
  $('accBride').innerHTML = ACCOUNTS.bride.map(row).join('');
}

function setLang(next) {
  const changed = next !== lang || !$('map').src;
  lang = next;
  const t = TEXT[lang];
  document.documentElement.lang = lang;
  document.body.classList.toggle('ja', lang === 'ja');
  document.title = t.pageTitle;
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = t[el.dataset.t];
    if (v !== undefined) el.innerHTML = v;
  });
  document.querySelectorAll('[data-lang-btn]').forEach(b => b.classList.toggle('on', b.dataset.langBtn === lang));
  buildCalendar();
  buildDday();
  buildAccounts();
  $('addCal').href = calendarLink();
  if (changed) {
    $('map').src = 'https://maps.google.com/maps?q=' + encodeURIComponent(WEDDING.mapQuery) + '&hl=' + lang + '&z=16&output=embed';
  }
  try {
    const u = new URL(location.href);
    if (lang === 'ja') u.searchParams.set('lang', 'ja'); else u.searchParams.delete('lang');
    history.replaceState(null, '', u);
  } catch (e) {}
}

// 갤러리
const tiles = GALLERY.map((src, i) => {
  const div = document.createElement('div');
  div.className = 'photo';
  div.dataset.empty = 'photo ' + (i + 1);
  const img = new Image();
  img.src = src; img.alt = ''; img.loading = 'lazy';
  img.onerror = () => img.remove();
  div.appendChild(img);
  div.addEventListener('click', () => openLightbox(i));
  $('gallery').appendChild(div);
  return div;
});

let lbList = [], lbIndex = 0;
function openLightbox(i) {
  lbList = GALLERY.filter((_, k) => tiles[k].querySelector('img'));
  const src = GALLERY[i];
  if (!tiles[i].querySelector('img')) return;
  lbIndex = lbList.indexOf(src);
  showLightbox();
  $('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function showLightbox() {
  $('lbImg').src = lbList[lbIndex];
  $('lbCount').textContent = (lbIndex + 1) + ' / ' + lbList.length;
}
function moveLightbox(step) {
  lbIndex = (lbIndex + step + lbList.length) % lbList.length;
  showLightbox();
}
function closeLightbox() {
  $('lb').classList.remove('open');
  document.body.style.overflow = '';
}
$('lbPrev').onclick = e => { e.stopPropagation(); moveLightbox(-1); };
$('lbNext').onclick = e => { e.stopPropagation(); moveLightbox(1); };
$('lbClose').onclick = closeLightbox;
$('lb').addEventListener('click', e => { if (e.target.id === 'lb') closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!$('lb').classList.contains('open')) return;
  if (e.key === 'ArrowLeft') moveLightbox(-1);
  if (e.key === 'ArrowRight') moveLightbox(1);
  if (e.key === 'Escape') closeLightbox();
});
let touchX = null;
$('lb').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
$('lb').addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) moveLightbox(dx < 0 ? 1 : -1);
  touchX = null;
});

// 복사 기능
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1800);
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  toast(TEXT[lang].copied);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if (b) copyText(b.dataset.copy);
});
$('copyAddr').onclick = () => copyText(WEDDING.addressKo);
$('copyLink').onclick = () => copyText(WEDDING.siteUrl + (lang === 'ja' ? '?lang=ja' : ''));

// 지도 버튼
$('naverMap').href = 'https://map.naver.com/p/search/' + encodeURIComponent(WEDDING.mapSearch);
$('kakaoMap').href = 'https://map.kakao.com/link/search/' + encodeURIComponent(WEDDING.mapSearch);
$('googleMap').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(WEDDING.mapQuery);

// 언어 버튼
document.querySelectorAll('[data-lang-btn]').forEach(b => b.onclick = () => setLang(b.dataset.langBtn));

// 처음 열었을 때 언어: 주소에 ?lang=ja 가 있거나, 휴대폰이 일본어 설정이면 일본어로
const param = new URLSearchParams(location.search).get('lang');
const startLang = TEXT[param] ? param : ((navigator.language || '').startsWith('ja') ? 'ja' : 'ko');
setLang(startLang);

// 스크롤 효과
const sections = document.querySelectorAll('main > section:not(.cover), main > footer');
if ('IntersectionObserver' in window) {
  sections.forEach(s => s.classList.add('fade'));
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add('show'); io.unobserve(en.target); }
  }), { threshold: 0.12 });
  sections.forEach(s => io.observe(s));
}
</script>
</body>
